# Version: 1.1.1
# Description: Global Ansible configuration with explanatory comments above each section and parameter.

# Core default settings governing Ansible execution, inventory location, and SSH behavior
[defaults]
# Enable callback plugins to display per-task execution times and total playbook runtime
callbacks_enabled = profile_tasks, timer
# Set the default file path for the host inventory
inventory = ./inventory/hosts.ini
# Define the default SSH username for connecting to managed nodes when not specified in inventory
remote_user = azureuser
# Specify the SSH private key file used to authenticate against managed nodes
private_key_file = ~/.ssh/id_rsa
# Enforce SSH host key verification against known_hosts for connection security
host_key_checking = True
# Prevent Ansible from generating .retry files when playbook runs fail
retry_files_enabled = False
# Set the primary stdout callback plugin controlling console output formatting
stdout_callback = default
# Specify the log file path where Ansible records all playbook execution output
log_path = /opt/ansible/automation.log

# Settings controlling privilege escalation on target hosts
[privilege_escalation]
# Enable privilege escalation automatically for tasks on managed nodes
become = True
# Define the utility used to elevate privileges on the remote system
become_method = sudo
# Specify the target user account to switch into after elevating privileges
become_user = root
# Disable interactive password prompts when elevating privileges (requires passwordless sudo)
become_ask_pass = False