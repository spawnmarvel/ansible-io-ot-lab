# Version: 1.6.4
# Description: Corrected task sequence placing configuration override before service startup.

- name: Install MySQL server package
  ansible.builtin.apt:
    name:
      - mysql-server
    state: present
    update_cache: true

- name: Check if MySQL is initialized on persistent storage
  ansible.builtin.stat:
    path: /data/mysql/ibdata1
  register: mysql_db_stat

- name: Stop MySQL service during data directory initialization check
  ansible.builtin.service:
    name: mysql
    state: stopped
  when: not mysql_db_stat.stat.exists
  check_mode: false

- name: Initialize MySQL data directory on persistent storage if uninitialized
  ansible.builtin.command:
    cmd: mysqld --initialize-insecure --user=mysql --datadir=/data/mysql
  when: not mysql_db_stat.stat.exists
  changed_when: true

- name: Apply custom MySQL configuration override
  ansible.builtin.template:
    src: override.cnf.j2
    dest: /etc/mysql/mysql.conf.d/99-override.cnf
    owner: root
    group: root
    mode: '0644'
  notify: Restart MySQL
  check_mode: false

- name: Ensure correct ownership and permissions on persistent MySQL data directory
  ansible.builtin.file:
    path: /data/mysql
    state: directory
    owner: mysql
    group: mysql
    recurse: true
    mode: '0750'

- name: Ensure MySQL service is started and enabled
  ansible.builtin.service:
    name: mysql
    state: started
    enabled: true
  check_mode: false