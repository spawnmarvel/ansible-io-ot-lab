---
# Version: 1.4.0
# Description: Idempotent main task file for installing, securing, and configuring MySQL 8.4 LTS.

# ==============================================================================
# Subsection 1: Package Installation & Service Bootstrap
# ==============================================================================

- name: Install MySQL server package
  ansible.builtin.apt:
    name:
      - mysql-server
    # The 'state: present' directive ensures that the MySQL server package is installed on the target system. If the package is already installed, Ansible will not attempt to reinstall it, maintaining idempotency.
    state: present
    update_cache: true

- name: Ensure MySQL service is started and enabled
  ansible.builtin.service:
    name: mysql
    state: started
    enabled: true
  check_mode: false


# ==============================================================================
# Subsection 2: Configuration & Storage Alignment
# ==============================================================================

- name: Apply custom MySQL configuration override
  ansible.builtin.template:
    src: override.cnf.j2
    dest: /etc/mysql/mysql.conf.d/99-override.cnf
    owner: root
    group: root
    # The 'mode: 0644' directive sets the file permissions for the configuration file, allowing read and write access for the owner (root) and read-only access for the group and others. 
    # This ensures that the configuration file is secure while still being accessible to the MySQL service.
    mode: '0644'
  notify: Restart MySQL
  check_mode: false

- name: Ensure correct ownership on MySQL data directory
  ansible.builtin.file:
    path: /var/lib/mysql
    # The 'state: directory' directive ensures that the specified path is treated as a directory. 
    # If the path does not exist, Ansible will create it as a directory. 
    #If it exists but is not a directory (e.g., it's a file), Ansible will raise an error.
    state: directory
    owner: mysql
    group: mysql
    mode: '0751'


# ==============================================================================
# Subsection 3: Root Password & Access Initialization
# ==============================================================================

- name: Check if root password is already configured
  ansible.builtin.command: mysql -u root -p'{{ mysql_root_password }}' -e "SELECT 1;"
  # The 'register: root_password_check' directive captures the output and return code of the command into a variable named 'root_password_check'.
  register: root_password_check
  # failed_when: false: Normally, if a shell command exits with a non-zero error code (e.g., trying to query MySQL before the password is set), 
  # Ansible halts the playbook. Setting this to false tells Ansible: 
  # "Even if this command fails, don't crash the playbook; just record the failure code so we can inspect it."
  failed_when: false
  # The 'changed_when: false' directive is used here to indicate that this task should not be marked as "changed" in the Ansible output, regardless of the command's success or failure.
  changed_when: false

- name: Set root password for MySQL root user on localhost
  ansible.builtin.command: >
    mysql -u root -e "ALTER USER 'root'@'localhost' IDENTIFIED BY '{{ mysql_root_password }}'; FLUSH PRIVILEGES;"
  when: root_password_check.rc != 0
  changed_when: true

- name: Check if root@127.0.0.1 user exists and is configured
  ansible.builtin.command: mysql -u root -p'{{ mysql_root_password }}' -e "SELECT User FROM mysql.user WHERE User='root' AND Host='127.0.0.1';"
  register: root_loopback_check
  failed_when: false
  changed_when: false

- name: Create root user for 127.0.0.1 and ::1
  ansible.builtin.command: >
    mysql -u root -p'{{ mysql_root_password }}' -e "CREATE USER IF NOT EXISTS 'root'@'127.0.0.1' IDENTIFIED BY '{{ mysql_root_password }}'; ALTER USER 'root'@'127.0.0.1' IDENTIFIED BY '{{ mysql_root_password }}'; CREATE USER IF NOT EXISTS 'root'@'::1' IDENTIFIED BY '{{ mysql_root_password }}'; ALTER USER 'root'@'::1' IDENTIFIED BY '{{ mysql_root_password }}'; GRANT ALL PRIVILEGES ON *.* TO 'root'@'127.0.0.1' WITH GRANT OPTION; GRANT ALL PRIVILEGES ON *.* TO 'root'@'::1' WITH GRANT OPTION; FLUSH PRIVILEGES;"
  when: root_loopback_check.rc != 0 or root_loopback_check.stdout == ""
  # The 'changed_when: true' directive is used here to indicate that this task should be marked as "changed" in the Ansible output, even if the command itself does not produce any output or changes.
  changed_when: true


# ==============================================================================
# Subsection 4: Remote Database & User Provisioning
# ==============================================================================

- name: Check if Zabbix database user exists
  ansible.builtin.command: mysql -u root -p'{{ mysql_root_password }}' -e "SELECT User FROM mysql.user WHERE User='zabbix' AND Host='10.68.68.%';"
  register: zabbix_user_check
  failed_when: false
  changed_when: false

- name: Create remote-accessible Zabbix database user and database
  ansible.builtin.command: >
    mysql -u root -p'{{ mysql_root_password }}' -e "CREATE USER IF NOT EXISTS 'zabbix'@'%' IDENTIFIED BY '{{ zabbix_password }}'; CREATE DATABASE IF NOT EXISTS zabbix CHARACTER SET utf8mb4 COLLATE utf8mb4_bin; GRANT ALL PRIVILEGES ON zabbix.* TO 'zabbix'@'%'; FLUSH PRIVILEGES;"
  when: zabbix_user_check.rc != 0 or zabbix_user_check.stdout == ""
  changed_when: true


# ==============================================================================
# Subsection 5: Security Hardening & Cleanup
# ==============================================================================

- name: Check if anonymous MySQL users exist
  ansible.builtin.command: mysql -u root -p'{{ mysql_root_password }}' -e "SELECT User FROM mysql.user WHERE User='';"
  register: anon_user_check
  failed_when: false
  changed_when: false

- name: Remove anonymous MySQL users
  ansible.builtin.command: >
    mysql -u root -p'{{ mysql_root_password }}' -e "DROP USER IF EXISTS ''@'localhost'; DROP USER IF EXISTS ''@'{{ ansible_facts.hostname }}'; FLUSH PRIVILEGES;"
  when: anon_user_check.rc == 0 and anon_user_check.stdout | length > 0
  changed_when: true

- name: Check if test database exists
  ansible.builtin.command: mysql -u root -p'{{ mysql_root_password }}' -e "SELECT SCHEMA_NAME FROM information_schema.schemata WHERE schema_name = 'test';"
  register: test_db_check
  failed_when: false
  changed_when: false

- name: Remove test database
  ansible.builtin.command: >
    mysql -u root -p'{{ mysql_root_password }}' -e "DROP DATABASE IF EXISTS test; FLUSH PRIVILEGES;"
  when: test_db_check.rc == 0 and test_db_check.stdout | length > 0
  changed_when: true