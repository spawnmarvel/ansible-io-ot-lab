# Version: 2.0.0
# Description: Production-grade Ansible task file using safe database migration from /var/lib/mysql to /data/mysql.

- name: Install MySQL server package
  ansible.builtin.apt:
    name:
      - mysql-server
    state: present
    update_cache: true

- name: Check if MySQL system database is already initialized on persistent storage
  ansible.builtin.stat:
    path: /data/mysql/mysql
  register: mysql_db_stat

- name: Stop MySQL service before migrating data directory
  ansible.builtin.service:
    name: mysql
    state: stopped
  when: not mysql_db_stat.stat.exists
  check_mode: false

- name: Ensure parent /data directory exists with correct permissions
  ansible.builtin.file:
    path: /data
    state: directory
    owner: root
    group: root
    mode: '0755'
  when: not mysql_db_stat.stat.exists
  check_mode: false

- name: Create persistent MySQL target directory
  ansible.builtin.file:
    path: /data/mysql
    state: directory
    owner: mysql
    group: mysql
    mode: '0750'
  when: not mysql_db_stat.stat.exists
  check_mode: false

- name: Migrate default MySQL data directory to persistent storage using rsync
  ansible.builtin.shell: |
    rsync -av /var/lib/mysql/ /data/mysql/
  when: not mysql_db_stat.stat.exists
  changed_when: true
  check_mode: false

- name: Ensure correct ownership and permissions on persistent MySQL data directory
  ansible.builtin.file:
    path: /data/mysql
    state: directory
    owner: mysql
    group: mysql
    recurse: true
    mode: '0750'
  check_mode: false

- name: Update AppArmor profile to allow access to custom datadir
  ansible.builtin.blockinfile:
    path: /etc/apparmor.d/usr.sbin.mysqld
    marker: "# {mark} ANSIBLE MANAGED BLOCK FOR /DATA/MYSQL"
    block: |
      /data/mysql/ r,
      /data/mysql/** rwk,
  notify: Reload AppArmor service
  check_mode: false

- name: Ensure AppArmor service is reloaded if profile changed
  ansible.builtin.meta: flush_handlers

- name: Apply custom MySQL configuration override pointing to datadir
  ansible.builtin.template:
    src: override.cnf.j2
    dest: /etc/mysql/mysql.conf.d/99-override.cnf
    owner: root
    group: root
    mode: '0644'
  notify: Restart MySQL
  check_mode: false

- name: Ensure MySQL service is started and enabled
  ansible.builtin.service:
    name: mysql
    state: started
    enabled: true
  check_mode: false