# Version: 1.9.5
# Description: Pre-creates /data/mysql with mysql ownership to satisfy mysqld permissions without directory creation conflicts.

- name: Install MySQL server package
  ansible.builtin.apt:
    name:
      - mysql-server
    state: present
    update_cache: true

- name: Ensure parent /data directory is owned by mysql
  ansible.builtin.file:
    path: /data
    state: directory
    owner: mysql
    group: mysql
    mode: '0750'
  check_mode: false

- name: Ensure persistent MySQL data directory exists and is owned by mysql
  ansible.builtin.file:
    path: /data/mysql
    state: directory
    owner: mysql
    group: mysql
    mode: '0750'
  check_mode: false

- name: Clear any stray files inside persistent MySQL data directory if uninitialized
  ansible.builtin.shell: |
    find /data/mysql -mindepth 1 -delete
  when: not ansible_check_mode
  changed_when: true
  check_mode: false

- name: Initialize MySQL data directory on persistent storage if uninitialized
  ansible.builtin.command:
    cmd: mysqld --initialize-insecure --user=mysql --datadir=/data/mysql
    creates: /data/mysql/mysql
  changed_when: true
  check_mode: false

- name: Ensure correct ownership and permissions on persistent MySQL data directory
  ansible.builtin.file:
    path: /data/mysql
    state: directory
    owner: mysql
    group: mysql
    recurse: true
    mode: '0750'
  check_mode: false