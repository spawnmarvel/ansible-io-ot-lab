# Version: 1.9.4
# Description: Fixed initialization sequence avoiding pre-creation conflicts for MySQL 8.4 LTS.

- name: Install MySQL server package
  ansible.builtin.apt:
    name:
      - mysql-server
    state: present
    update_cache: true

- name: Ensure parent /data directory is owned by mysql
  ansible.builtin.file:
    path: /data
    state: directory
    owner: mysql
    group: mysql
    mode: '0750'
  check_mode: false

- name: Ensure persistent MySQL data directory is absent if uninitialized
  ansible.builtin.file:
    path: /data/mysql
    state: absent
  when: not ansible_check_mode
  changed_when: false
  # Only remove if the system database files do not exist yet
  # (checked via a stat task or skipped if already initialized)

- name: Initialize MySQL data directory on persistent storage if uninitialized
  ansible.builtin.command:
    cmd: mysqld --initialize-insecure --user=mysql --datadir=/data/mysql
    creates: /data/mysql/mysql
  changed_when: true
  check_mode: false

- name: Ensure correct ownership and permissions on persistent MySQL data directory
  ansible.builtin.file:
    path: /data/mysql
    state: directory
    owner: mysql
    group: mysql
    recurse: true
    mode: '0750'
  check_mode: false