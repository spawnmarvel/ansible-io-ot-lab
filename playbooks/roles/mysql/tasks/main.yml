# Version: 1.9.2
# Description: Clean and robust MySQL initialization sequence relying on native mysqld directory creation.

- name: Install MySQL server package
  ansible.builtin.apt:
    name:
      - mysql-server
    state: present
    update_cache: true

- name: Check if MySQL system database is initialized on persistent storage
  ansible.builtin.stat:
    path: /data/mysql/mysql
  register: mysql_db_stat

- name: Stop MySQL service during data directory initialization check
  ansible.builtin.service:
    name: mysql
    state: stopped
  when: not mysql_db_stat.stat.exists
  check_mode: false

- name: Ensure parent /data directory is owned by mysql to allow native creation
  ansible.builtin.file:
    path: /data
    state: directory
    owner: mysql
    group: mysql
    mode: '0750'
  when: not mysql_db_stat.stat.exists
  check_mode: false

- name: Ensure persistent MySQL data directory is completely absent if uninitialized
  ansible.builtin.file:
    path: /data/mysql
    state: absent
  when: not mysql_db_stat.stat.exists
  check_mode: false

- name: Initialize MySQL data directory on persistent storage if uninitialized
  ansible.builtin.command:
    cmd: mysqld --initialize-insecure --user=mysql --datadir=/data/mysql
  when: not mysql_db_stat.stat.exists
  changed_when: true
  check_mode: false

- name: Update AppArmor profile to allow access to custom datadir
  ansible.builtin.blockinfile:
    path: /etc/apparmor.d/usr.sbin.mysqld
    marker: "# {mark} ANSIBLE MANAGED BLOCK FOR /DATA/MYSQL"
    block: |
      /data/mysql/ r,
      /data/mysql/** rwk,
  notify: Reload AppArmor service
  check_mode: false

- name: Ensure AppArmor service is reloaded if profile changed
  ansible.builtin.meta: flush_handlers

- name: Apply custom MySQL configuration override
  ansible.builtin.template:
    src: override.cnf.j2
    dest: /etc/mysql/mysql.conf.d/99-override.cnf
    owner: root
    group: root
    mode: '0644'
  notify: Restart MySQL
  check_mode: false

- name: Ensure correct ownership and permissions on persistent MySQL data directory
  ansible.builtin.file:
    path: /data/mysql
    state: directory
    owner: mysql
    group: mysql
    recurse: true
    mode: '0750'
  check_mode: false

- name: Ensure MySQL service is started and enabled
  ansible.builtin.service:
    name: mysql
    state: started
    enabled: true
  when: not ansible_check_mode
  check_mode: false