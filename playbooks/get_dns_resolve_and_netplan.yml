# Version: 1.1.1
# Author: aspen
# Description: 
- name: Gather and Display DNS Resolution and Netplan Configuration
  hosts: ot_nodes:idmz_nodes

  gather_facts: true
  become: true
  tasks:
    - name: Get DNS configuration details via resolved.conf
      ansible.builtin.command: grep 'DNS' /etc/systemd/resolved.conf
      # Register the output to a variable for later use
      register: resolved_output
      # Indicate that this task does not change the system state
      changed_when: false

    - name: Display DNS host or ip address from resolv.conf
      ansible.builtin.debug:
        msg: "Resolved.conf {{ resolved_output }}"