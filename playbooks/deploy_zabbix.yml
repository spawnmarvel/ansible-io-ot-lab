# Version: 1.0.0
# Author: aspen
# Description:  This playbook is designed to install and configure the Zabbix server on all hosts in the zabbix_servers group, 
- name: Deploy zabbix server
  hosts: zabbix_servers
  become: true
  # Note: This playbook deploys the Zabbix role to all hosts in the zabbix_servers group, ensuring that the Zabbix server is installed, configured, and ready for monitoring.
  roles:
    - zabbix_server