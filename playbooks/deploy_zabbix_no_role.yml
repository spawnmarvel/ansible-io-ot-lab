---
# Version: 1.0.0
# Author: aspen
# Description: Master playbook to deploy the zabbix server withoput using a role. 
# This playbook is designed to install and configure the Zabbix server on all hosts in the zabbix_servers group, 
# ensuring that the monitoring system is set up correctly and ready for use.
- name: Deploy zabbix server
  hosts: zabbix_servers
  become: true
  tasks:
    - name: Check if zabbix-server package is installed
      ansible.builtin.package_facts:
        # Gather package facts to check if the zabbix-server package is installed on the target hosts.
        # This module collects information about installed packages, which can be used to determine the installation status of specific packages.
        # It does not know anything about "zabbix" in particular—package_facts simply pulls the entire list of installed packages into ansible_facts.packages.
        manager: auto

    - name: Print zabbix-server package installation status
      ansible.builtin.debug:
        # and then your expression ('zabbix-server' in ansible_facts.packages) checks whether a 
        # package literally named zabbix-server is in that dictionary.
        msg: "Zabbix server package is installed: {{ 'zabbix-server' in ansible_facts.packages }}"

    - name: Get the latest zabbix package and download on ansible control node
      ansible.builtin.get_url:
        # Download the latest Zabbix package from the official Zabbix repository to the /tmp/ directory on the Ansible control node.
        url: "https://repo.zabbix.com/zabbix/7.0/ubuntu/pool/main/z/zabbix-release/zabbix-release_latest_7.0+ubuntu26.04_all.deb"
        dest: "/tmp/zabbix-release_latest_7.0+ubuntu26.04_all.deb"
      # This task is executed only once (run_once: true) and is delegated to the localhost (the Ansible control node) to avoid downloading the package multiple times on each target host.
      run_once: true
      become: false
      delegate_to: localhost
      # The task will only run if the zabbix-server package is not already installed on the target hosts, as determined by the previous package_facts check.
      when: "'zabbix-server' not in ansible_facts.packages"

    - name: Copy the zabbix package to the target host 

    - name: Install the zabbix package on the target host with dpkg

    - name: Update apt package lists on the target host

    - name: Install the zabbix package on the target host with apt

    - name: Check that initial data zabbix is created in mysql host

    - name: On Mysql host import initial schema and data from the zabbix server package into the zabbix database

    - name: On Mysql set global log_bin_trust_function_creators on

    - name: Configure the database for Zabbix server

    - name: On Mysql set global log_bin_trust_function_creators off

    - name: Start Zabbix server and agent processes

    - name: Go to the Zabbix web interface and complete the setup wizard