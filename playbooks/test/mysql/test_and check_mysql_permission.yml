---
# Check permissions of /data/mysql using namei command
#
- name: Check permissions namei -l /data/mysql    
  hosts: db_servers_mysql
  gather_facts: false
  become: true
  tasks:
    - name: Check permissions of /data/mysql using namei
      ansible.builtin.command: namei -l /data/mysql 
      register: namei_output
      # Indicate that this task does not change the system state
      changed_when: false
    - name: Display the permissions of /data/mysql
      ansible.builtin.debug: 
        msg: |
        Permissions of /data/mysql are: 
        {{ namei_output.stdout }}