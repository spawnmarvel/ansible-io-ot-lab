# Version: 3.6.0
# Description: Idempotent data disk discovery (loop-free selection), partitioning, ext4 formatting, UUID extraction, and persistent fstab mounting at /mnt/datadrive1.

- name: Configure data disk storage at /data
  hosts: mysql01
  become: true
  gather_facts: true
  tasks:

    # =========================================================================
    # Step 1: Dynamic Secondary Disk Discovery & OS Protection (Loop-Free)
    # =========================================================================
    - name: Discover secondary data disk dynamically
      ansible.builtin.set_fact:
        # Value Source: Filters the system device keys, matches standard disk prefixes, 
        # and explicitly rejects 'sda' (OS root) and 'sdb' (Azure temp drive) to pick 'sdc'.
        resolved_data_device: "{{ (ansible_facts.devices.keys() | select('match', '^(sd|vd|nvme)[a-z]+$') | reject('in', ['sda', 'sdb'])) | first }}"

    - name: Fail if secondary data disk could not be dynamically resolved
      ansible.builtin.fail:
        msg: "Critical: No valid secondary data disk could be identified safely."
      when: resolved_data_device is not defined

    - name: Display resolved data disk
      ansible.builtin.debug:
        msg: "Successfully resolved secondary data disk: /dev/{{ resolved_data_device }}"

    # =========================================================================
    # Step 2: Partitioning and ext4 Formatting
    # =========================================================================
    - name: Ensure partition 1 exists on data disk
      ansible.builtin.parted:
        device: "/dev/{{ resolved_data_device }}"
        number: 1
        state: present
        fs_type: ext4

    - name: Format data partition to ext4 if not already formatted
      ansible.builtin.filesystem:
        fstype: ext4
        dev: "/dev/{{ resolved_data_device }}1"
        force: false

    # =========================================================================
    # Interactive Confirmation Prompt before Step 3
    # =========================================================================
    # - name: Confirm before proceeding to Step 3 (UUID extraction and mounting)
    #  ansible.builtin.pause:
    #    prompt: "Ready to proceed with Step 3: UUID extraction and mounting at /mnt/datadrive1. Enter 'yes' to continue or anything else to abort."
    #  register: confirmation_input

    #- name: Abort playbook if user declined confirmation
    #  ansible.builtin.fail:
    #    msg: "Playbook execution aborted by user at Step 3 confirmation."
    #  when: confirmation_input.user_input | lower != 'yes'

    # =========================================================================
    # Step 3: UUID Extraction & Persistent Mounting at /mnt/datadrive1
    # =========================================================================
    - name: Get UUID of the data disk partition
      ansible.builtin.command: "blkid -s UUID -o value /dev/{{ resolved_data_device }}1"
      register: disk_uuid_output
      changed_when: false

    - name: Set fact for disk UUID
      ansible.builtin.set_fact:
        data_disk_uuid: "{{ disk_uuid_output.stdout | trim }}"

    - name: Ensure /data mount point directory exists
      ansible.builtin.file:
        path: /data
        state: directory
        owner: root
        group: root
        mode: '0750'

    - name: Ensure persistent mount using UUID in fstab for /data
      ansible.builtin.mount:
        path: /data
        src: "UUID={{ data_disk_uuid }}"
        fstype: ext4
        opts: defaults,nofail,noatime
        state: mounted

    # =========================================================================
    # Step 4: System Reboot & Post-Boot Mount Verification
    # =========================================================================
    - name: Reboot target node to test fstab mount survival across boots
      ansible.builtin.reboot:
        msg: "Rebooting mysql01 to verify persistent data drive mount via UUID."
        connect_timeout: 5
        reboot_timeout: 300
        pre_reboot_delay: 2
        post_reboot_delay: 10

    - name: Verify mount point is active after reboot
      ansible.builtin.command: "df -h /data"
      register: mount_check_output
      changed_when: false

    - name: Display mount verification result
      ansible.builtin.debug:
        msg: "{{ mount_check_output.stdout }}"

   