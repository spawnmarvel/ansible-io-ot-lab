# Version: 2.3.1
# Description: Dynamic data disk discovery (size-agnostic), partition, ext4 formatting, UUID extraction, and persistent fstab mounting at /mnt/datadrive1.

# Iterate through available devices and filter out the root disk and non-block storage to find the secondary data disk.
- name: Discover secondary data disk dynamically (excluding root device)
  ansible.builtin.set_fact:
    resolved_data_device: "{{ item.key }}"
  when:
    - item.value.size_mb is defined
    - item.value.size_mb | int > 0
    - item.key != ansible_facts['root_device_name'] | basename
    - (item.key.startswith('sd') or item.key.startswith('vd') or item.key.startswith('nvme'))
  loop: "{{ ansible_devices | dict2items }}"

# Abort playbook execution immediately if no safe secondary block device could be discovered.
- name: Fail if secondary data disk could not be dynamically resolved
  ansible.builtin.fail:
    msg: "Critical: No valid secondary data disk could be identified safely."
  when: resolved_data_device is not defined

# Create the primary partition table and partition entry on the resolved block device.
- name: Ensure partition 1 exists on data disk
  ansible.builtin.parted:
    device: "/dev/{{ resolved_data_device }}"
    number: 1
    state: present
    fs_type: ext4

# Initialize an ext4 filesystem on the partition idempotently without destroying existing data.
- name: Format data partition to ext4 if not already formatted
  ansible.builtin.filesystem:
    fstype: ext4
    dev: "/dev/{{ resolved_data_device }}1"
    force: false

# Query the storage subsystem to retrieve the persistent filesystem UUID of the partition.
- name: Get UUID of the data disk partition
  ansible.builtin.command: "blkid -s UUID -o value /dev/{{ resolved_data_device }}1"
  register: disk_uuid_output
  changed_when: false

# Store the extracted UUID string into a reusable task fact variable.
- name: Set fact for disk UUID
  ansible.builtin.set_fact:
    data_disk_uuid: "{{ disk_uuid_output.stdout | trim }}"

# Create the target mount directory path with explicit ownership and secure access permissions.
- name: Ensure mount point directory exists
  ansible.builtin.file:
    path: /mnt/datadrive1
    state: directory
    owner: mysql
    group: mysql
    mode: '0750'

# Configure persistent mounting in /etc/fstab using the stable UUID and robust boot flags.
- name: Ensure persistent mount using UUID in fstab
  ansible.builtin.mount:
    path: /mnt/datadrive1
    src: "UUID={{ data_disk_uuid }}"
    fstype: ext4
    opts: defaults,nofail,noatime
    state: mounted

# Validate systemd mount units and fstab syntax to prevent boot stalls or configuration errors.
- name: Verify fstab and systemd mount unit validity for boot persistence
  ansible.builtin.command: findmnt --verify
  register: findmnt_verify
  changed_when: false

# Print confirmation message detailing the verified mount point and target device.
- name: Display mount verification status
  ansible.builtin.debug:
    msg: "Mount configuration at /mnt/datadrive1 successfully verified for boot persistence using disk /dev/{{ resolved_data_device }}."