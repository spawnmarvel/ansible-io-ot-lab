# Description: Dynamic data disk discovery (size-agnostic), partition, 
# ext4 formatting, UUID extraction, and persistent fstab mounting at /mnt/datadrive1.

# Version: 3.2.2
# Author: aspen
# Description: Step 1 & 2 - Dynamically discover unpartitioned secondary data disk and create ext4 partition with source variable tracing comments.

- name: Configure data disk storage
  hosts: mysql01
  become: true
  gather_facts: true  # <--- Triggers Ansible to probe the target host and populate all 'ansible_facts' variables automatically.
  tasks:

    - name: Discover unpartitioned secondary data disk dynamically
      ansible.builtin.set_fact:
        # Variable: resolved_data_device
        # Value Source: Picks up the value of 'item.key' when the conditional 'when' criteria match.
        resolved_data_device: "{{ item.key }}"
      when:
        # Variable: ansible_facts.get('root_device_name', '')
        # Value Source: Picked up automatically from host probe facts gathered during 'gather_facts: true'.
        - item.key != ansible_facts.get('root_device_name', '') | basename
        
        # Variables: item.key and item.value
        # Value Source: Picked up from the loop iterating over the dictionary items of 'ansible_facts.devices'.
        #   - 'ansible_facts.devices': A system dictionary populated automatically by Ansible fact gathering (listing sda, sdb, sdc, loop devices, etc.).
        #   - 'item.key': The dictionary key representing the device name string (e.g., 'sdc').
        #   - 'item.value.partitions': Nested dictionary inside device metadata showing existing partitions on that device.
        - (item.key.startswith('sd') or item.key.startswith('vd') or item.key.startswith('nvme'))
        - item.value.partitions | length == 0
      loop: "{{ ansible_facts.devices | dict2items }}"  # <--- Source: Converts the 'ansible_facts.devices' system fact dictionary into a list of key/value pairs for iteration.

    - name: Fail if secondary data disk could not be dynamically resolved
      ansible.builtin.fail:
        msg: "Critical: No valid unpartitioned secondary data disk could be identified safely."
      when: 
        # Variable: resolved_data_device
        # Value Source: Evaluates whether the custom fact was successfully set in the previous task.
        resolved_data_device is not defined

    - name: Display resolved data disk
      ansible.builtin.debug:
        msg: >-
          Successfully resolved secondary data disk: /dev/{{ resolved_data_device }}
          (Source variable 'resolved_data_device' populated dynamically from ansible_facts.devices loop)

    - name: Ensure partition 1 exists on data disk
      ansible.builtin.parted:
        # Variable: resolved_data_device
        # Value Source: Interpolates the custom fact variable established earlier (e.g., 'sdc') to form '/dev/sdc'.
        device: "/dev/{{ resolved_data_device }}"
        number: 1
        state: present
        fs_type: ext4

    - name: Format data partition to ext4 if not already formatted
      ansible.builtin.filesystem:
        fstype: ext4
        # Variable: resolved_data_device
        # Value Source: Interpolates the custom fact variable combined with partition suffix '1' (e.g., '/dev/sdc1').
        dev: "/dev/{{ resolved_data_device }}1"
        force: false