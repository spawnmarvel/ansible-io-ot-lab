# Description: Dynamic data disk discovery (size-agnostic), partition, 
# ext4 formatting, UUID extraction, and persistent fstab mounting at /mnt/datadrive1.

# Version: 3.1.0
# Author: aspen
# Description: Step 1 - Dynamically discover the unpartitioned secondary data disk while safely excluding the OS root device and temporary storage.

- name: Configure data disk storage
  hosts: mysql01
  become: true
  gather_facts: true
  tasks:
    - name: Discover unpartitioned secondary data disk dynamically
      ansible.builtin.set_fact:
        resolved_data_device: "{{ item.key }}"
      when:
        - item.key != ansible_facts.root_device_name | basename
        - (item.key.startswith('sd') or item.key.startswith('vd') or item.key.startswith('nvme'))
        - item.value.partitions | length == 0
      loop: "{{ ansible_facts.devices | dict2items }}"

    - name: Fail if secondary data disk could not be dynamically resolved
      ansible.builtin.fail:
        msg: "Critical: No valid unpartitioned secondary data disk could be identified safely."
      when: resolved_data_device is not defined

    - name: Display resolved data disk
      ansible.builtin.debug:
        msg: "Successfully resolved secondary data disk: /dev/{{ resolved_data_device }}"