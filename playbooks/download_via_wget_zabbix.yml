---
# Version: 1.0.0
# Author: aspen
# Description: Downloads the Zabbix package using wget for installation on Ubuntu 26.04
# https://www.zabbix.com/download?zabbix=7.0&os_distribution=ubuntu&os_version=26.04&components=server_frontend_agent_2&db=mysql&ws=apache
- name: Download Zabbix via wget
  hosts: all
  become: true
  tasks:
    - name: Download Zabbix package
      ansible.builtin.get_url:
        url: "https://repo.zabbix.com/zabbix/7.0/ubuntu/pool/main/z/zabbix-release/zabbix-release_latest_7.0+ubuntu26.04_all.deb"
        dest: "/tmp/zabbix-release_latest_7.0+ubuntu26.04_all.deb"