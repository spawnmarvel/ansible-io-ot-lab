---
# Version: 4.5.0
# Description: Dynamically discovers the secondary data disk, formats, and mounts persistently with mount-aware directory handling.

- name: Dynamically discover, configure, and mount data drive
  hosts: db_servers
  gather_facts: true
  become: true
  vars:
    target_size_gb: "32"
    data_dir: "/var/lib/mysql"

  tasks:
    - name: Get the device mounted at root (/)
      ansible.builtin.set_fact:
        root_device_name: "{{ (ansible_facts.mounts | selectattr('mount', 'equalto', '/') | map(attribute='device') | first | regex_replace('[0-9]+$', '') | basename) }}"

    - name: Dynamically find 32GB data disk excluding root disk
      ansible.builtin.set_fact:
        resolved_data_device: "/dev/{{ item.key }}"
      loop: "{{ ansible_facts.devices | dict2items }}"
      when: 
        - item.key != root_device_name
        - target_size_gb in item.value.size

    - name: Assert a valid data device was discovered
      ansible.builtin.assert:
        that:
          - resolved_data_device is defined
          - resolved_data_device != ""
          - resolved_data_device != "/dev/{{ root_device_name }}"
        fail_msg: "SAFETY ABORT: Could not automatically detect a valid secondary data disk of size ~{{ target_size_gb }}GB."

    - name: Display discovered target device
      ansible.builtin.debug:
        msg: "Target data disk successfully resolved to {{ resolved_data_device }}"

    - name: Check if primary partition already exists
      ansible.builtin.stat:
        path: "{{ resolved_data_device }}1"
      register: partition_stat

    - name: Create primary partition on target device if missing
      community.general.parted:
        device: "{{ resolved_data_device }}"
        number: 1
        state: present
        fs_type: ext4
      when: not partition_stat.stat.exists

    - name: Check existing filesystem type on target partition
      ansible.builtin.command: blkid -s TYPE -o value "{{ resolved_data_device }}1"
      register: existing_fstype
      failed_when: false
      changed_when: false

    - name: Create ext4 filesystem only if not already formatted
      ansible.builtin.filesystem:
        fstype: ext4
        dev: "{{ resolved_data_device }}1"
      when: existing_fstype.stdout | default('') != 'ext4'

    - name: Check if target directory is currently a mount point
      ansible.builtin.command: mountpoint -q "{{ data_dir }}"
      register: is_mounted
      failed_when: false
      changed_when: false

    - name: Ensure mount point directory exists when not currently mounted
      ansible.builtin.file:
        path: "{{ data_dir }}"
        state: directory
        mode: '0750'
        owner: mysql
        group: mysql
      when: is_mounted.rc != 0

    - name: Mount secondary drive persistently with nofail option
      ansible.builtin.mount:
        path: "{{ data_dir }}"
        src: "{{ resolved_data_device }}1"
        fstype: ext4
        opts: defaults,nofail
        state: mounted