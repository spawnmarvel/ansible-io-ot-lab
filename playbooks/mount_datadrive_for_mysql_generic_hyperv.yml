# Version: 3.8.0
# Description: Idempotent data disk discovery, partitioning, ext4 formatting, UUID extraction, and persistent fstab mounting at /mnt/datadrive1.

- name: Configure data disk storage
  hosts: mysql01
  become: true
  gather_facts: true
  tasks:

    # =========================================================================
    # Step 1: Dynamic Secondary Disk Discovery & OS Protection
    # =========================================================================
    - name: Discover secondary data disk dynamically
      ansible.builtin.set_fact:
        # Value Source: Filters standard disk device keys and rejects the primary disk 
        # backing the root mount point ('/') from ansible_mounts.
        resolved_data_device: "{{ (ansible_facts.devices.keys() | select('match', '^(sd|vd|nvme)[a-z0-9]+$') | reject('equalto', ansible_mounts | selectattr('mount', 'eq', '/') | map(attribute='device') | first | regex_replace('[0-9]+$', '') | basename) | reject('in', ['sdb'])) | first }}"

    - name: Fail if secondary data disk could not be dynamically resolved
      ansible.builtin.fail:
        msg: "Critical: No valid secondary data disk could be identified safely."
      when: resolved_data_device is not defined

    - name: Display resolved data disk
      ansible.builtin.debug:
        msg: "Successfully resolved secondary data disk: /dev/{{ resolved_data_device }}"

    # =========================================================================
    # Step 2: Partitioning and ext4 Formatting
    # =========================================================================
    - name: Ensure partition 1 exists on data disk
      ansible.builtin.parted:
        device: "/dev/{{ resolved_data_device }}"
        number: 1
        state: present
        fs_type: ext4

    - name: Format data partition to ext4 if not already formatted
      ansible.builtin.filesystem:
        fstype: ext4
        dev: "/dev/{{ resolved_data_device }}1"
        force: false

    # =========================================================================
    # Step check: Dual-Mode Confirmation (CLI Interactive vs Semaphore Survey)
    # =========================================================================
    - name: Prompt interactively if run from CLI without survey variables
      ansible.builtin.pause:
        prompt: "Ready to proceed with Step 3: UUID extraction and mounting at /mnt/datadrive1. Enter 'yes' to continue or anything else to abort."
      register: cli_confirmation
      when: Proceed_to_step3 is not defined

    - name: Normalize confirmation source for CLI or Semaphore
      ansible.builtin.set_fact:
        final_confirmation: "{{ Proceed_to_step3 | default(cli_confirmation.user_input | default('no')) | lower }}"

    - name: Abort playbook if confirmation was declined
      ansible.builtin.fail:
        msg: "Playbook execution aborted: Confirmation was not set to 'yes'."
      when: final_confirmation != 'yes'

    # =========================================================================
    # Step 3: UUID Extraction & Persistent Mounting at /mnt/datadrive1 .
    # =========================================================================